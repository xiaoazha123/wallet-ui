<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Planet 钱包原型</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div class="device">
    <div id="root"></div>
  </div>
  <script type="text/babel" data-presets="react">
    const { useState, useMemo, useEffect } = React

    function Icon({ name, size = 20 }) {

        earn: "M12 2l3 7h7l-5.5 4 2 7-6.5-4.5L6 20l2-7L2.5 9H9z",
        invest: "M3 17l5-6 4 5 6-9 3 4-1 1-2-3-6 9-4-5-5 6z",
        game: "M5 8h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2l-2 2H9l-2-2H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2z",
        academy: "M3 8l9-4 9 4-9 4-9-4zm2 6v-4l7 3 7-3v4l-7 3-7-3z",
        settings: "M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.04.17-.01.36.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.58 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.04-.22.01-.41-.12-.61l-2.03-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6-3.6 3.6 3.6z",

        back: "M15 18l-6-6 6-6",
        plus: "M12 5v14M5 12h14",
        qr: "M3 3h8v8H3V3zm2 2v4h4V5H5zm10-2h6v6h-6V3zm2 2v2h2V5h-2zM3 13h6v6H3v-6zm2 2v2h2v-2H5zm8 0h2v2h-2v-2zm4 0h4v4h-4v-4z",
        copy: "M9 9h9v9H9V9zm-3 3H3V3h9v3H6v6z",
        chart: "M4 18h16M6 16l3-4 3 3 4-6",
        search: "M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm8.5 14.5L18 15",
        menu: "M3 7h18M3 12h18M3 17h18",
        more: "M6 12a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm6 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm6 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4",
        down: "M6 9l6 6 6-6",
        yes: "M20 6L9 17l-5-5",

      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round">
          <path d={paths[name]} />

    }

    function Button({ children, onClick, variant = "primary", className = "" }) {
      return (
        <button className={`btn ${variant} ${className}`} onClick={onClick}>{children}</button>
      )
    }

    function Input({ label, type = "text", value, onChange, placeholder }) {
      return (
        <div className="input">
          <label>{label}</label>
          <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} />
        </div>
      )
    }

    function Card({ children }) {
      return <div className="card">{children}</div>
    }

    function Toast({ message, onClose }) {
      useEffect(() => {
        const t = setTimeout(onClose, 2000)
        return () => clearTimeout(t)
      }, [onClose])
      return <div className="toast">{message}</div>
    }

    function BottomNav({ active, onSelect }) {
      const items = [
        { key: 'home', label: '首页', icon: 'wallet' },
        { key: 'market', label: '市场', icon: 'invest' },
        { key: 'trade', label: '交易', icon: 'earn' },
        { key: 'discover', label: '发现', icon: 'game' },
        { key: 'assets', label: '资产', icon: 'academy' },
      ]
      return (
        <nav className="bottom">
          {items.map(i => (
            <button key={i.key} className={active === i.key ? 'active' : ''} onClick={() => onSelect(i.key)}>
              <Icon name={i.icon} />
              <span>{i.label}</span>
            </button>
          ))}
        </nav>
      )
    }

    function Header({ title, onBack, onSettings, onNetwork, showBack, right }) {
      return (
        <header className="header">
          <div className="left">
            {showBack && <button className="icon" onClick={onBack}><Icon name="back" /></button>}
            <h1>{title}</h1>
          </div>
          <div className="right" style={{display:'flex', alignItems:'center', gap:'12px'}}>
            {right}
            <button className="icon" onClick={onNetwork}><Icon name="network" size={24} /></button>
            <button className="icon" onClick={onSettings}><Icon name="settings" size={24} /></button>
          </div>
        </header>
      )
    }

    function LaunchSplash({ lang, onLang, onNext }) {
      return (
        <div className="content">
          <Card>
            <div className="brand">Planet 钱包</div>
            <div className="lang">
              <button className={`lang-btn ${lang==='中文'?'active':''}`} onClick={()=>onLang('中文')}>中文</button>
              <button className={`lang-btn ${lang==='English'?'active':''}`} onClick={()=>onLang('English')}>English</button>
            </div>
            <div className="intro">
              <div className="intro-item">去中心化 · 本地私钥安全</div>
              <div className="intro-item">支持 Keystore / 助记词 / 私钥</div>
              <div className="intro-item">内置质押生息入口</div>
            </div>
            <div className="row">
              <Button onClick={onNext}>继续</Button>
            </div>
          </Card>
        </div>
      )
    }

    function InitChoice({ onCreate, onImport }) {
      return (
        <div className="content">
          <Card>
            <div className="list-head">钱包初始化方式</div>
            <div className="row">
              <Button onClick={onCreate}>创建钱包</Button>
              <Button variant="secondary" onClick={onImport}>导入钱包</Button>
            </div>
            <div className="tip">Planet Wallet 为去中心化钱包，请妥善备份助记词。</div>
          </Card>
        </div>
      )
    }

    function CreatePassword({ onNext }) {
      const [pwd,setPwd] = useState('')
      const [pwd2,setPwd2] = useState('')
      const [face,setFace] = useState(false)
      const strong = pwd.length>=8 && /[A-Z]/.test(pwd) && /[a-z]/.test(pwd) && /\d/.test(pwd)
      const ok = strong && pwd===pwd2
      return (
        <div className="content">
          <Card>
            <div className="list-head">设置密码</div>
            <Input label="密码" type="password" value={pwd} onChange={setPwd} placeholder="至少8位，含大小写与数字" />
            <Input label="确认密码" type="password" value={pwd2} onChange={setPwd2} placeholder="再次输入" />
            <div className="setting-row"><span>启用生物识别</span><input type="checkbox" checked={face} onChange={()=>setFace(!face)} /></div>
            <div className="rule">密码强度：{strong?'强':'弱'}</div>
            <div className="row">
              <Button onClick={()=>ok && onNext({pwd,face})} variant={ok?'primary':'secondary'}>下一步</Button>
            </div>
          </Card>
        </div>
      )
    }

    function generateMnemonic() {
      const dict = ['atom','blade','crystal','dawn','ember','flame','globe','harbor','ivory','jewel','knock','leaf','mango','navy','orbit','pearl','query','river','solar','tiger','ultra','vivid','whale','xenon']
      const words = []
      for(let i=0;i<12;i++){ words.push(dict[Math.floor(Math.random()*dict.length)]) }
      return words
    }

    function ShowMnemonic({ words, onCopy, onNext, onAcknowledgeChange, acknowledged }) {
      return (
        <div className="content">
          <Card>
            <div className="list-head">助记词</div>
            <div className="mn-grid">
              {words.map((w,i)=>(<div key={i} className="mn-cell">{w}</div>))}
            </div>
            <div className="risk">请不要截图，截图可能泄露资产</div>
            <div className="row">
              <Button variant="secondary" onClick={()=>{ if(confirm('确认复制助记词？')) onCopy(words.join(' ')) }}>复制</Button>
            </div>
            <div className="checks">
              <label><input type="checkbox" checked={acknowledged.a} onChange={e=>onAcknowledgeChange({...acknowledged,a:e.target.checked})} /> 我已知晓助记词遗失将无法恢复资产</label>
              <label><input type="checkbox" checked={acknowledged.b} onChange={e=>onAcknowledgeChange({...acknowledged,b:e.target.checked})} /> 我已手动抄写助记词并妥善保存</label>
            </div>
            <div className="row"><Button onClick={onNext} variant={(acknowledged.a && acknowledged.b)?'primary':'secondary'}>下一步</Button></div>
          </Card>
        </div>
      )
    }

    function VerifyMnemonic({ words, onSuccess }) {
      const shuffled = useMemo(()=>words.slice().sort(()=>Math.random()-0.5), [words])
      const [selected,setSelected] = useState([])
      function pick(w){ if(selected.length<words.length) setSelected([...selected,w]) }
      const ok = selected.join(' ')===words.join(' ')
      return (
        <div className="content">
          <Card>
            <div className="list-head">助记词验证</div>
            <div className="mn-selected">
              {selected.map((w,i)=>(<div key={i} className="mn-cell fill">{w}</div>))}
            </div>
            <div className="mn-grid">
              {shuffled.map((w,i)=>(<button key={i} className="mn-cell" onClick={()=>pick(w)}>{w}</button>))}
            </div>
            <div className="row">
              <Button onClick={()=> ok ? onSuccess() : alert('顺序不正确，请重新选择')} >完成</Button>
            </div>
          </Card>
        </div>
      )
    }

    function ImportWallet({ onDone }) {
      const [tab,setTab] = useState('助记词')
      const [mn,setMn] = useState('')
      const [pk,setPk] = useState('')
      const [ks,setKs] = useState('')
      const [pass,setPass] = useState('')
      function validateMnemonic(txt){ const n=txt.trim().split(/\s+/).length; return n===12 || n===24 }
      function validatePk(txt){ return /^0x?[0-9a-fA-F]{64}$/.test(txt.trim()) }
      function validateKs(txt){ try{ JSON.parse(txt); return true }catch(e){ return false } }
      function submit(){ if(tab==='助记词' && !validateMnemonic(mn)) return alert('助记词格式错误'); if(tab==='私钥' && !validatePk(pk)) return alert('私钥格式错误'); if(tab==='Keystore' && (!validateKs(ks) || !pass)) return alert('Keystore或密码错误'); onDone() }
      return (
        <div className="content">
          <Card>
            <div className="tabs">
              {['助记词','私钥','Keystore'].map(t=> (
                <button key={t} className={`tab-btn ${tab===t?'active':''}`} onClick={()=>setTab(t)}>{t}</button>
              ))}
            </div>
            {tab==='助记词' && (
              <div>
                <Input label="助记词" value={mn} onChange={setMn} placeholder="12/24 词，空格分隔" />
              </div>
            )}
            {tab==='私钥' && (
              <div>
                <Input label="私钥" value={pk} onChange={setPk} placeholder="64位hex或0x开头" />
              </div>
            )}
            {tab==='Keystore' && (
              <div>
                <div className="input"><label>JSON</label><textarea className="area" value={ks} onChange={e=>setKs(e.target.value)} placeholder="粘贴Keystore JSON" /></div>
                <Input label="密码" type="password" value={pass} onChange={setPass} placeholder="输入密码" />
              </div>
            )}
            <div className="row"><Button onClick={submit}>确认导入</Button></div>
          </Card>
        </div>
      )
    }

    function HomePage({ address, onWallets, onReceive, onStake, onInvest, onAssetDetail, onMore, onCopy, onMini }) {
      const [q,setQ] = useState('')
      const [tab,setTab] = useState('自选')
      const [currentWallet,setCurrentWallet] = useState({ name:'My Wallet', addr: address })
      const [showMorePopup, setShowMorePopup] = useState(false)
      const coins = [
        { name:'BTC', price:'¥120000', chg:'+0.38%' },
        { name:'ETH', price:'¥120000', chg:'+0.38%' },
        { name:'BNB', price:'¥120000', chg:'+0.38%' },
        { name:'SOL', price:'¥120000', chg:'+0.38%' },
        { name:'ASTER', price:'¥120000', chg:'+0.38%' },
        { name:'HYPE', price:'¥120000', chg:'+0.38%' },
      ]
      const visible = coins.slice(0,3)
      return (
        <div className="content">
          <div className="searchbar">
            <div className="search">
              <input className="search-input" value={q} onChange={e=>setQ(e.target.value)} placeholder="搜索" />
              <button className="icon small"><Icon name="search" /></button>
            </div>
          </div>
          <Card>
            <div className="wallet-card">
              <div className="wallet-row clickable" onClick={onWallets}>
                <span className="wallet-title">{currentWallet.name}</span>
                <span className="icon small"><Icon name="down" /></span>
                <span className="vbar">|</span>
                <button className="icon small" onClick={(e)=>{ e.stopPropagation(); navigator.clipboard.writeText(address); onCopy && onCopy(address) }}><Icon name="copy" /></button>
              </div>
              <div className="wallet-amt">¥ 0.00</div>
              <Button onClick={onReceive}>接收</Button>
            </div>
            
            <div className="mini-actions">
              <Button variant="secondary" onClick={()=>onMini('signin')}>签到</Button>
              <Button variant="secondary" onClick={()=>onMini('payment')}>支付</Button>
              <Button variant="secondary" onClick={()=>onMini('invite')}>邀请</Button>
              <Button variant="secondary" onClick={()=>onMini('governance')}>治理</Button>
              <Button variant="secondary" onClick={()=>setShowMorePopup(true)}><Icon name="more" /></Button>
            </div>
            <div className="big-actions">
              <button className="big-btn" onClick={onStake}>存钱</button>
              <button className="big-btn" onClick={onInvest}>投资</button>
            </div>
          </Card>
          <Card>
            <div className="tabs">
              {['自选','热门','最新'].map(t=> (
                <button key={t} className={`tab-btn ${tab===t?'active':''}`} onClick={()=>setTab(t)}>{t}</button>
              ))}
            </div>
            <div className="coin-list">
              {visible.map((c,i)=> (
                <button key={i} className="coin-item" onClick={()=>onAssetDetail({code:c.name})}>
                  <div className="coin-info">
                    <span className="coin-dot" />
                    <span className="coin-name">{c.name}</span>
                  </div>
                  <div className="coin-right">
                    <span className="coin-price">{c.price}</span>
                    <span className={`coin-change ${c.chg.startsWith('+')?'up':'down'}`}>{c.chg}</span>
                  </div>
                </button>
              ))}
            </div>
            <div className="more-row">
              <button className="more-link" onClick={()=>onMore(tab)}>查看更多</button>
            </div>
          </Card>

          {showMorePopup && (
            <>
              <div className="popup-overlay" onClick={()=>setShowMorePopup(false)} />
              <div className="popup-content">
                <div className="popup-header">
               <h3>更多功能</h3>
               <button className="close-btn" onClick={()=>setShowMorePopup(false)}><Icon name="close" /></button>
            </div>
                <div className="popup-grid" style={{display:'flex', justifyContent:'flex-start', gap:'16px'}}>
                   <div className="p-item" onClick={()=>onMini('tasks')}><div className="p-icon"><Icon name="copy"/></div>任务</div>
                   <div className="p-item" onClick={()=>onMini('points')}><div className="p-icon"><Icon name="earn"/></div>积分</div>
                </div>
              </div>
            </>
          )}
        </div>
      )
    }

    function NewsDetailPage({ news, onBack, onCourse }) {
      const courses = [

               <p>用户在参与相关项目时，务必注意资产安全，核对合约地址，避免因盲目操作导致资产损失。</p>

                       <div className="c-title">{c.title}</div>
                       <div className="c-sub">{c.time}</div>

      const [seg,setSeg] = useState('市场')
      const [q,setQ] = useState('')

        { name:'ETH', price:'¥120000', chg:'+0.38%' },
        { name:'BNB', price:'¥120000', chg:'+0.38%' },
        { name:'SOL', price:'¥120000', chg:'+0.38%' },
        { name:'ASTER', price:'¥120000', chg:'+0.38%' },
        { name:'HYPE', price:'¥120000', chg:'+0.38%' },
      ]
      const longCoins = Array.from({length:30}, (_,i)=> coins[i % coins.length])

      const newsList = [
        { id: 1, title: '以太坊上海升级即将启动，质押提款将开放', source: 'ETH Foundation', time: '10分钟前', tags: ['技术','升级'] },

        { id: 3, title: 'DeFi 协议总锁仓量突破 500 亿美元', source: 'DeFi Pulse', time: '2小时前', tags: ['DeFi','市场'] },
        { id: 4, title: '某交易所发布新一期资产储备证明', source: 'CEX News', time: '3小时前', tags: ['交易所','合规'] },
        { id: 5, title: 'Layer2 网络日交易量超过主网', source: 'L2 Beat', time: '5小时前', tags: ['Layer2','技术'] },
      ]

      return (

          <div className="top-tabs">
            {['市场','新闻','牛人榜'].map(t=> (
              <button key={t} className={`tab-btn ${seg===t?'active':''}`} onClick={()=>setSeg(t)}>{t}</button>

          </div>

          {seg==='市场' && (
            <>
              <div className="market-search">

    function SwapPage({ onSwap }) {
      const [payAmt, setPayAmt] = useState('')
      const [rxAmt, setRxAmt] = useState('')
      const [payToken, setPayToken] = useState('USDT')
      const [rxToken, setRxToken] = useState('PNT')
      const rate = 12.5 // 1 USDT = 12.5 PNT

      useEffect(() => {
        if (!payAmt) { setRxAmt(''); return }
        const val = parseFloat(payAmt)
        if (!isNaN(val)) {
          setRxAmt((val * rate).toFixed(2))
        }
      }, [payAmt])

      function doSwap() {
        if (!payAmt) return
        onSwap()
      }

      function switchTokens() {
        setPayToken(rxToken)
        setRxToken(payToken)
        setPayAmt('')
      }

      return (
        <div className="content">
          <div className="swap-container">
            <div className="swap-card top">
              <div className="swap-label">支付</div>

      const [toast,setToast] = useState('')
      const address = '0x12AB...89FF'
      const [lang,setLang] = useState(localStorage.getItem('lang')||'中文')
      const [backed,setBacked] = useState(true)
      const [mnemonic,setMnemonic] = useState(generateMnemonic())
      const [showNetModal, setShowNetModal] = useState(false)
      const [currentNet, setCurrentNet] = useState('main')
      function push(v){ setStack(s=>[...s,view]); setView(v) }
      function back(){ setView(stack[stack.length-1] || (tab==='home'?'home':tab)); setStack(s=>s.slice(0,-1)) }
      function gotoTab(t){ setTab(t); setView(t) }
      const showBack = stack.length>0 && view!=='onboard'
      const title = useMemo(()=>{
        const map={home:'首页', market:'市场', trade:'交易', discover:'发现', assets:'资产'}
        if(view==='launch') return '欢迎'
        if(view==='init') return '初始化'
        if(view==='create-pass') return '设置密码'
        if(view==='mnemonic') return '助记词'
        if(view==='verify') return '助记词验证'
        if(view==='bind-invite') return '绑定邀请'
        if(view==='import') return '导入钱包'
        if(view==='wallets') return '钱包管理'
        if(view==='asset') return '资产详情'
        if(view==='send') return '发送'
        if(view==='receive') return '收款'
        if(view==='settings') return '设置'
        if(view==='security') return '安全设置'
        if(view==='network') return '多链设置'
        if(view==='earn-detail') return '存钱详情'
        if(view==='stake') return '存钱'
        if(view==='redeem') return '赎回'
        if(view==='deposit') return 'USDT 充值'
        if(view==='buy') return '购买代币'
        if(view==='game-detail') return '游戏'
        if(view==='course') return '课程详情'
        if(view==='signin') return '每日签到'
        if(view==='payment') return '支付'
        if(view==='invite') return '邀请好友'
        if(view==='governance') return '治理'
        if(view==='news-detail') return '新闻详情'
        if(view==='more') return '更多服务'
        if(view==='tasks') return '任务中心'
        if(view==='points') return '我的积分'
        if(view==='earn') return '存钱'
        if(view==='invest') return '投资'
        if(view==='game') return '游戏中心'
        if(view==='academy') return 'Web3 学院'
        return map[tab]
      },[tab,view])

      const [currentToken,setCurrentToken] = useState(null)
      const [currentProduct,setCurrentProduct] = useState(null)
      const [currentGame,setCurrentGame] = useState(null)
      const [currentCourse,setCurrentCourse] = useState(null)
      const [currentNews,setCurrentNews] = useState(null)
      const [currentMarketTab,setCurrentMarketTab] = useState('自选')

      return (
        <div className="app">
          <Header title={title} showBack={showBack} onBack={back} onSettings={()=>push('settings')} onNetwork={()=>setShowNetModal(true)} right={null} />

          {showNetModal && <NetworkModal current={currentNet} onClose={()=>setShowNetModal(false)} onSelect={(id)=>{ setCurrentNet(id); setShowNetModal(false); setToast('已切换网络'); }} />}

          {view==='launch' && (
            <LaunchSplash lang={lang} onLang={(l)=>{ setLang(l); localStorage.setItem('lang', l) }} onNext={()=>setView('init')} />
          )}
          {view==='init' && (<InitChoice onCreate={()=>setView('create-pass')} onImport={()=>setView('import')} />)}
          {view==='create-pass' && (<CreatePassword onNext={()=>setView('mnemonic')} />)}
          {view==='mnemonic' && (<ShowMnemonic words={mnemonic} onCopy={(text)=>{ navigator.clipboard.writeText(text); setToast('已复制助记词') }} acknowledged={{a:false,b:false}} onAcknowledgeChange={()=>{}} onNext={()=>setView('verify')} />)}
          {view==='verify' && (<VerifyMnemonic words={mnemonic} onSuccess={()=>{ setBacked(false); setView('bind-invite') }} />)}
          {view==='import' && (<ImportWallet onDone={()=>{ setBacked(true); setView('bind-invite') }} />)}
          {view==='bind-invite' && (<BindInvitePage onNext={()=>{ setToast('欢迎使用 Planet 钱包'); setView('home') }} />)}

          {view==='home' && (
            <HomePage address={address} onWallets={()=>push('wallets')} onReceive={()=>push('receive')} onStake={()=>push('earn')} onInvest={()=>push('invest')} onAssetDetail={(t)=>{ setCurrentToken(t); push('asset') }} onMore={(which)=>{ setCurrentMarketTab(which); gotoTab('market') }} onCopy={()=>{ setToast('已复制地址') }} onMini={(v)=>push(v)} />
          )}

          {view==='signin' && (<SignInPage onSign={()=>{ setToast('签到成功 +10积分'); back() }} />)}
          {view==='payment' && (<PaymentPage />)}
          {view==='invite' && (<InvitePage />)}
          {view==='governance' && (<GovernancePage />)}
          {view==='more' && (<MorePage onTask={()=>push('tasks')} onPoints={()=>push('points')} />)}
          {view==='tasks' && (<TasksPage />)}
          {view==='points' && (<PointsPage />)}

          {view==='market' && (
            <MarketPage 
              initialTab={currentMarketTab} 
              onAssetDetail={(t)=>{ setCurrentToken(t); push('asset') }} 
              onNewsDetail={(n)=>{ setCurrentNews(n); push('news-detail') }}
            />
          )}

          {view==='news-detail' && currentNews && (
            <NewsDetailPage 
              news={currentNews} 
              onBack={back} 
              onCourse={(c)=>{ setCurrentCourse(c); push('course') }} 
            />
          )}

          {view==='trade' && (<SwapPage onSwap={()=>{ setToast('兑换成功'); }} />)}

          {view==='discover' && (
            <DiscoverPage 
              onGame={()=>setView('game')} 
              onAcademy={()=>setView('academy')} 
              onGameDetail={(g)=>{ setCurrentGame(g); push('game-detail') }} 
              onCourseDetail={(c)=>{ setCurrentCourse(c); push('course') }} 
            />
          )}

          {view==='wallets' && (<WalletsManage onBack={back} />)}
          {view==='asset' && currentToken && (<AssetDetail token={currentToken} onBack={back} onSend={()=>push('send')} onReceive={()=>push('receive')} />)}
          {view==='send' && (<SendFlow onConfirm={()=>{ setToast('已广播到链上'); back() }} onCancel={back} />)}
          {view==='receive' && (<ReceiveView address={address} onCopy={(text)=>{ navigator.clipboard.writeText(text); setToast('已复制地址'); }} />)}

          {view==='settings' && (
            <SettingsPage 
              onWallets={()=>push('wallets')} 
              onSecurity={()=>push('security')} 
              onNetwork={()=>push('network')} 
              onLang={()=>{ 
                const next = lang==='中文'?'English':'中文'; 
                setLang(next); 
                localStorage.setItem('lang', next); 
                setToast(`Switched to ${next}`) 
              }} 
            />
          )}
          {view==='security' && (<SecuritySettings onBack={back} />)}
          {view==='network' && (<NetworkSettings onBack={back} />)}

          {view==='earn' && (<StakingHome onDetail={(p)=>{ setCurrentProduct(p); push('earn-detail') }} onStakeNow={(p)=>{ setCurrentProduct(p); push('stake') }} />)}
          {view==='earn-detail' && currentProduct && (<EarnDetail product={currentProduct} onStake={()=>push('stake')} onRedeem={()=>push('redeem')} onDeposit={()=>push('deposit')} />)}
          {view==='stake' && (<StakeFlow onConfirm={()=>{ setToast('已质押'); back() }} onCancel={back} />)}
          {view==='redeem' && (<RedeemFlow onConfirm={()=>{ setToast('已赎回'); back() }} onCancel={back} />)}
          {view==='deposit' && (<DepositUSDT address={address} onCopy={(text)=>{ navigator.clipboard.writeText(text); setToast('已复制地址'); }} />)}

          {view==='invest' && (<InvestHome onBuy={()=>push('buy')} />)}
          {view==='buy' && (<BuyFlow onConfirm={()=>{ setToast('购买成功'); back() }} onCancel={back} />)}

          {view==='game' && (<GameList onEnter={(g)=>{ setCurrentGame(g); push('game-detail') }} />)}
          {view==='game-detail' && currentGame && (<GameDetail game={currentGame} onTx={(m)=>setToast(m)} />)}

          {view==='academy' && (<AcademyList onOpen={(c)=>{ setCurrentCourse(c); push('course') }} />)}
          {view==='course' && currentCourse && (<CourseDetail course={currentCourse} onComplete={()=>setToast('学习进度已记录')} />)}

          {view==='assets' && (
            <WalletOverview onReceive={()=>push('receive')} onSend={()=>push('send')} onSwap={()=>push('trade')} onStake={()=>push('earn')} onAssetDetail={(t)=>{ setCurrentToken(t); push('asset') }} onWallets={()=>push('wallets')} />
          )}

          {view!=='onboard' && (<BottomNav active={tab} onSelect={gotoTab} />)}
          {toast && <Toast message={toast} onClose={()=>setToast('')} />}
        </div>
      )
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />)
  </script>
</body>
</html>
